run_name: "relu_cifar10_k2"

runs:
  - dm_config:
      dataset: "cifar-10"
      gaussian: false
      rank: 1
      batch_size: 10000
      noise: 0.0
    activation_function: "relu"
    tied: false
    bias: false
    training_method: "hermite_integral"
    learning_rate: 1.0
    step_count: 125
    alpha: 1000
    N: null
    line_type: "solid"
    line_color: "green"
    D: 1024
    K: 2
  
  - dm_config:
      dataset: "cifar-10"
      gaussian: false
      rank: 1
      batch_size: 10000
      noise: 0.0
    activation_function: "relu"
    tied: false
    bias: false
    training_method: "analytical_integral"
    learning_rate: 1.0
    step_count: 125
    alpha: 1000
    N: null
    line_type: "solid"
    line_color: "blue"
    D: 1024
    K: 2

plot_name: "ReLU on CIFAR-10 (K=5)"
x_label: "α"
y_label: "Generalization error"
