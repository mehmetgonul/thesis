run_name: "erf_cifar10_k2"

runs:
  - data_manager:
      dataset: "cifar-10"
      gaussian: false
      rank: 1
      batch_size: 10000
      noise: 0.0
    activation_function: "erf"
    tied: false
    bias: false
    training_method: "analytical_integrals"
    learning_rate: 1.0
    step_count: 125
    N: null
    line_type: "solid"
    line_color: "green"
    D: 1024
    K: 6

plot_name: "ERF on CIFAR-10 (K=4)"
x_label: "α"
y_label: "Generalization error"
